sonar.projectKey=zeal-frontend-client
sonar.projectName=ZEAL Frontend Client
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx
# src/mocks contiene el API local simulado (MSW) con usuarios semilla de demostración:
# solo se carga en desarrollo y en pruebas, nunca en el build de producción.
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**,src/mocks/**
sonar.coverage.exclusions=src/main.tsx

sonar.javascript.lcov.reportPaths=coverage/lcov.info
