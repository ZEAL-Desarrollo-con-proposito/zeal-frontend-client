# Archivos estáticos de la SPA. Las rutas del cliente (/empleado/..., /psicologo/...) caen en index.html.
server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        default_type text/plain;
        return 200 'ok';
    }

    # Vite pone un hash en el nombre de cada recurso: se pueden cachear para siempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
